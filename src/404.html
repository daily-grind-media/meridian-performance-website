<!doctype html>
<html lang="en" class="no-js">
<head>
{{HEAD}}
</head>
<body>
{{HEADER active="none"}}

<main id="main">
  <section class="page-hero notfound" aria-labelledby="nf-title">
    <div class="page-hero__bg" aria-hidden="true"><img src="{{A}}assets/img/terrain-left.webp" width="820" height="661" alt=""></div>
    <div class="wrap">
      <p class="eyebrow eyebrow--rule">Error 404</p>
      <h1 class="h1" id="nf-title" style="margin-top:22px;font-size:clamp(2.75rem,6.4vw,6rem)"><span class="metal">Page</span> <span class="metal-red">not found.</span></h1>
      <div class="hero__rule" aria-hidden="true"></div>
      <p class="body-lg measure" style="margin-top:28px;color:var(--titanium)">The page you were looking for doesn’t exist or may have moved.</p>
      <div class="notfound__actions">
        <a class="btn btn--primary" href="{{U:home}}">Back to Home {{ICON arrow}}</a>
        <a class="btn btn--ghost" href="{{U:blog}}">Read the Blog</a>
        <a class="text-link" href="{{U:contact}}">Get Started {{ICON arrow}}</a>
      </div>
    </div>
  </section>
</main>

{{FOOTER}}
</body>
</html>
